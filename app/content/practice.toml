# What the tutor says in practice mode. The app reads this file when it starts; restart it
# after an edit. Not reviewed by a native speaker.
#
# A line ending in _lb is Luxembourgish, the line of the same name ending in _en its English.
# tests/test_practice.py checks every Luxembourgish word here against the LOD dictionary.

[tutor]
# {topic} is replaced by the topic's name_lb in open_lb and by its name_en in open_en.
open_lb = "Moien! Haut schwätze mir iwwer d'Theema {topic}. Mir fänke ganz allgemeng un."
open_en = "Hi! Today we talk about the topic {topic}. We start very generally."
# Said after an answer the tutor has no reaction to: a second "I don't know", or an answer
# whose reaction could not be made.
ack_en = "Got it."
# Around a correction, after the tutor's reaction: said_en, the learner's own words, the
# reason, the better version. better_en stands in for a reason that is missing.
said_en = "One small thing. You said"
better_en = "it would be:"
# After an answer in English, in front of the Luxembourgish for it.
could_say_en = "In Luxembourgish you could say"
# Asks for more after a short answer, once per question.
more_lb = "Kënnt Dir e bësse méi dozou soen?"
more_en = "Can you say a bit more about that?"
# After "I don't know": {question_en} is the English of the question. starter_en follows when
# the question has a starter, and then the starter itself.
again_en = "No problem. The question was: {question_en}"
starter_en = "You could start with:"
# After the last question of the topic the learner picks one of three photos (photos.toml).
# photo_intro is said with the three on the page. Then three questions about the picked one:
# photo, the photo's own question from photos.toml, photo_last.
photo_intro_lb = "Elo kucke mir e Bild. Sicht Iech eent eraus."
photo_intro_en = "Now let's look at a picture. Pick one."
photo_lb = "Wat gesitt Dir um Bild? Wien ass do, a wat maachen d'Leit?"
photo_en = "What do you see in the picture? Who is there, and what are the people doing?"
photo_last_lb = "Wéi fannt Dir dat Bild?"
photo_last_en = "How do you like the picture?"
end_en = "That's all for today, thanks for talking with me."
# The look back on a talk, after "Stop here" or after its last question: the tutor's own
# sentences, then once_more_en and the better versions of the talk again. After "Stop here"
# end_en follows; a talk that ran to its end has had it.
once_more_en = "Once more:"
# The whole look back when the learner stopped before the first answer.
no_answers_en = "No worries, we'll leave it there. Come back whenever you feel like a chat."
# The one question every sentence of the LB-JUDGE set is judged as an answer to
# (scripts/lb_judge.py run); never asked in a talk.
eval_lb = "Sot mir eppes."
eval_en = "Tell me something."
# Said once, after the opening, in front of the first question of the warm-up.
warmup_lb = "Fir den Ufank e puer kuerz Froen."
warmup_en = "A few short questions to start."

# Said once, in front of the first question of the stage.
[tutor.stage]
past_lb = "Elo schwätze mir iwwer fréier."
past_en = "Now let's talk about the past."
present_lb = "A wéi ass et haut?"
present_en = "And how is it today?"
plans_lb = "A wat sinn Är Pläng?"
plans_en = "And what are your plans?"

# A talk opens with two of these, drawn at random, before the questions of its topic; the
# next talk of the session draws others first. `starter` is optional: how an answer could begin.

